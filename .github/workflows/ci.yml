name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...

  static-binaries:
    # The release binaries have to start on older systems too. Built with cgo,
    # the amd64 binary needs the runner's glibc (Ubuntu 20.04: GLIBC_2.34 not
    # found), and make dist refuses it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Build the release binaries
        run: make dist
      - name: The check refuses a binary built with cgo
        # An empty CGO_ENABLED leaves the choice to Go, as the Makefile did up
        # to v0.30.0: cgo for the native amd64 build.
        run: |
          if make dist CGO_ENABLED= > cgo.log 2>&1; then
            cat cgo.log
            echo "make dist accepted a dynamically linked binary"
            exit 1
          fi
          cat cgo.log
          grep -q "dist/malwatch-linux-amd64 is dynamically linked" cgo.log || {
            echo "make dist failed, but not at the check for static binaries"; exit 1; }

  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Lint the extension
        run: find ispconfig -name '*.php' -print0 | xargs -0 -n1 php -l
      # php -l only sees syntax. These two catch what breaks at run time:
      # a constant ISPConfig does not define, and a page whose form, template
      # or language file is missing or unregistered.
      - name: Check constants
        run: sh ispconfig/tests/check_constants.sh
      - name: Check wiring
        run: sh ispconfig/tests/check_wiring.sh
      - name: Upgrade helpers
        run: php ispconfig/tests/upgrade_helpers_test.php
      - name: Upgrade offers
        run: php ispconfig/tests/upgrade_offers_test.php
      - name: Panel helpers
        run: php ispconfig/tests/panel_helpers_test.php
      - name: WAF functions
        run: php ispconfig/tests/waf_lib_test.php
      - name: WAF page helpers
        run: php ispconfig/tests/waf_panel_test.php
      - name: WAF page actions
        run: php ispconfig/tests/waf_panel_post_test.php
      - name: WAF rule catalog
        run: php ispconfig/tests/waf_rules_catalog_test.php
      - name: WAF origin ranges
        run: php ispconfig/tests/waf_origin_test.php
      - name: WAF origin sources
        run: php ispconfig/tests/waf_origin_sources_test.php
      - name: WAF proxycheck
        run: php ispconfig/tests/waf_proxycheck_test.php
      - name: WAF ban
        run: php ispconfig/tests/waf_ban_test.php
      - name: WAF fail2ban
        run: php ispconfig/tests/waf_f2b_test.php
      - name: No raw line breaks in strings
        run: php ispconfig/tests/string_breaks_test.php
      - name: WAF tools
        run: |
          php -l waf/waf-switch
          php -l waf/waf-report
          bash -n waf/waf-guard
          bash -n waf/install.sh
          MALWATCH_WAF_LIB=ispconfig/interface/lib/malwatch_waf_lib.inc.php php waf/waf-report ispconfig/tests/waf_audit_sample.log

  clean-cms:
    # The counter-check that matters: a freshly downloaded WordPress and
    # Joomla must produce no findings at all. A rule set that flags honest
    # code is worse than no rule set, because nobody reads the report after
    # the third false alarm.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Build
        run: go build -o malwatch ./cmd/malwatch
      - name: Fetch signatures
        run: ./malwatch update --sig-dir=sigs --quiet
      - name: Fetch a clean WordPress and Joomla
        run: |
          mkdir -p www && cd www
          curl -fsSL https://wordpress.org/latest.tar.gz | tar xz
          mkdir -p joomla && cd joomla
          curl -fsSL https://github.com/joomla/joomla-cms/releases/download/5.1.4/Joomla_5.1.4-Stable-Full_Package.tar.gz | tar xz
      - name: Scan and require a clean result
        run: |
          set +e
          ./malwatch scan --path=www --sig-dir=sigs --state-dir=state --offline --quiet --json > report.json
          code=$?
          set -e
          found=$(grep -c '"rule":' report.json || true)
          echo "exit code $code, $found finding(s)"
          if [ "$found" != "0" ]; then
            echo "False positives on untouched vendor code:"
            grep -A4 '"rule":' report.json | head -60
            exit 1
          fi
      - name: A planted shell must still be found
        run: |
          printf '<?php @eval($_POST["cmd"]);' > www/wordpress/planted.php
          set +e
          ./malwatch scan --path=www --sig-dir=sigs --state-dir=state --offline --quiet --json > planted.json
          code=$?
          set -e
          grep -q 'php.eval.request' planted.json || { echo "the planted shell was not found"; exit 1; }
          [ "$code" = "1" ] || { echo "exit code $code, expected 1"; exit 1; }

  repair-roundtrip:
    # The claim the whole feature rests on, in its two halves: a file dropped
    # inside a vendor directory is gone once that directory has been replaced,
    # and a file outside one survives and is exactly what the following scan
    # reports. Getting the first half wrong leaves malware behind; getting the
    # second wrong destroys customer data.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Build
        run: go build -o malwatch ./cmd/malwatch
      - name: Fetch signatures
        run: ./malwatch update --sig-dir=sigs --quiet
      - name: A WordPress with four planted files
        run: |
          mkdir -p www && cd www
          curl -fsSL https://wordpress.org/wordpress-6.6.2.zip -o wp.zip
          unzip -q wp.zip && rm wp.zip
          cd wordpress
          # inside vendor directories - the repair has to take these with it
          printf '<?php @eval($_POST["cmd"]);' > wp-includes/2mOnl635P1W.php
          printf '<?php @eval($_POST["cmd"]);' > wp-content/plugins/akismet/backdoor.php
          # outside - these are the customer's side and have to survive
          printf '<?php @eval($_POST["cmd"]);' > 2q7ajgCOGou.php
          mkdir -p wp-content/uploads/2026/06
          printf '<?php @eval($_POST["cmd"]);' > wp-content/uploads/2026/06/shell.php
      - name: Repair
        run: |
          set +e
          ./malwatch repair --path=www/wordpress --backup-dir=backups \
            --progress=progress.json --json --out=repair.json
          code=$?
          set -e
          echo "exit code $code"
          [ "$code" = "0" ] || { echo "the repair did not complete cleanly"; cat repair.json; exit 1; }
          test -d backups || { echo "nothing was backed up"; exit 1; }
          python3 -c "import json;d=json.load(open('progress.json'));assert d['schema']==1 and d['kind']=='repair'"
      - name: What sat in a vendor directory has to be gone
        run: |
          for f in www/wordpress/wp-includes/2mOnl635P1W.php \
                   www/wordpress/wp-content/plugins/akismet/backdoor.php; do
            [ -e "$f" ] && { echo "$f survived the exchange"; exit 1; }
          done
          echo "both dropped files are gone"
      - name: What sat outside one has to survive
        run: |
          for f in www/wordpress/2q7ajgCOGou.php \
                   www/wordpress/wp-content/uploads/2026/06/shell.php \
                   www/wordpress/wp-content/plugins/akismet/akismet.php; do
            [ -e "$f" ] || { echo "$f was removed"; exit 1; }
          done
          echo "the customer's side is intact"
      - name: The scan must report exactly those two files
        run: |
          set +e
          ./malwatch scan --path=www/wordpress --sig-dir=sigs --state-dir=state \
            --offline --quiet --json > after.json
          set -e
          left=$(jq -r '.findings[].path' after.json | sort -u)
          echo "$left"
          expected=$(printf '%s\n%s\n' \
            "www/wordpress/2q7ajgCOGou.php" \
            "www/wordpress/wp-content/uploads/2026/06/shell.php" | sort)
          [ "$left" = "$expected" ] || {
            echo "expected exactly the two files outside the vendor directories"
            exit 1; }

  upgrade-roundtrip:
    # The promise of malwatch upgrade, in both directions: a real update leaves
    # the new release of the vendor in place with the site answering, and an
    # update that breaks the site is taken back with the site answering again.
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli
          tools: wp-cli
      - name: Build
        run: go build -o malwatch ./cmd/malwatch
      - name: WordPress 6.5.3 with akismet 5.3.2
        run: |
          mkdir -p www/wp
          wp core download --version=6.5.3 --locale=en_US --path=www/wp
          wp config create --path=www/wp --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1
          wp core install --path=www/wp --url=http://127.0.0.1:8080 --title=Probe \
            --admin_user=probe --admin_password=probe --admin_email=probe@beispiel.de --skip-email
          wp plugin install akismet --version=5.3.2 --activate --path=www/wp
      - name: Serve it
        run: |
          (cd www/wp && php -S 127.0.0.1:8080 > "$RUNNER_TEMP/php-server.log" 2>&1 &)
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/wp-login.php && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8080/
      - name: Upgrade the core within its branch and the plugin
        run: |
          cat > plan.json <<EOF
          {"schema":1,"installs":[{"path":"$PWD/www/wp","url":"http://127.0.0.1:8080/","elements":[
            {"kind":"core","version":"6.5.5"},
            {"kind":"plugin","slug":"akismet","version":"5.3.3"}]}]}
          EOF
          set +e
          ./malwatch upgrade --path="$PWD/www" --plan=plan.json --run-as="$(id -un)" \
            --php="$(command -v php)" --wp-cli="$(command -v wp)" --connect=127.0.0.1:8080 \
            --quarantine-dir=quarantine --progress=progress.json --json --out=upgrade.json
          code=$?
          set -e
          jq -r '.elements[] | "\(.kind) \(.slug // "") \(.outcome) \(.message // "")"' upgrade.json
          [ "$code" = "0" ] || { echo "exit code $code, expected 0"; cat upgrade.json; exit 1; }
          jq -e '[.elements[].outcome] == ["updated","updated"]' upgrade.json
          jq -e '.kind == "upgrade" and (.steps | length) == 2' progress.json
      - name: The files are the new releases, and the site answers
        run: |
          wp core verify-checksums --path=www/wp
          wp plugin verify-checksums akismet --path=www/wp
          grep -q "6.5.5" www/wp/wp-includes/version.php
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          curl -fsS -o /dev/null http://127.0.0.1:8080/wp-login.php
      - name: A plugin release that breaks the site
        run: |
          mkdir -p www/wp/wp-content/plugins/malwatch-probe vendor/plugin build/malwatch-probe
          printf '<?php\n/*\nPlugin Name: malwatch probe\nVersion: 1.0.0\n*/\n' \
            > www/wp/wp-content/plugins/malwatch-probe/malwatch-probe.php
          wp plugin activate malwatch-probe --path=www/wp
          printf '<?php\n/*\nPlugin Name: malwatch probe\nVersion: 2.0.0\n*/\nmalwatch_probe_undefined_function();\n' \
            > build/malwatch-probe/malwatch-probe.php
          (cd build && zip -qr ../vendor/plugin/malwatch-probe.2.0.0.zip malwatch-probe)
          (cd vendor && python3 -m http.server 8090 > "$RUNNER_TEMP/vendor.log" 2>&1 &)
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8090/plugin/malwatch-probe.2.0.0.zip && break
            sleep 1
          done
      - name: Upgrade it and expect the rollback
        run: |
          cat > broken.json <<EOF
          {"schema":1,"installs":[{"path":"$PWD/www/wp","url":"http://127.0.0.1:8080/","elements":[
            {"kind":"plugin","slug":"malwatch-probe","version":"2.0.0"}]}]}
          EOF
          set +e
          ./malwatch upgrade --path="$PWD/www" --plan=broken.json --run-as="$(id -un)" \
            --php="$(command -v php)" --wp-cli="$(command -v wp)" --connect=127.0.0.1:8080 \
            --quarantine-dir=quarantine --vendor-base=http://127.0.0.1:8090/ --json --out=broken-run.json
          code=$?
          set -e
          jq . broken-run.json
          [ "$code" = "2" ] || { echo "exit code $code, expected 2"; exit 1; }
          jq -e '.elements[0].outcome == "rolled_back"' broken-run.json
          grep -q "Version: 1.0.0" www/wp/wp-content/plugins/malwatch-probe/malwatch-probe.php
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          curl -fsS -o /dev/null http://127.0.0.1:8080/wp-login.php
          [ ! -e www/wp/.maintenance ] || { echo ".maintenance left behind"; exit 1; }
