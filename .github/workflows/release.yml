name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      # The tag reaches the shell as an environment variable: an expression in
      # a run step is pasted into the script text before bash reads it, and a
      # git tag may hold a quote or $(...).
      # The Makefile pastes VERSION into a command line of its own, so the
      # value also has to have the form of a version number.
      - name: Resolve version
        id: ver
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          version="${GITHUB_REF_NAME:-$INPUT_TAG}"
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if ! [[ "$version" =~ $pattern ]]; then
            echo "::error::„${version}“ ist keine Versionsnummer der Form v1.2.3. Ein Release entsteht aus einem Tag dieser Form; beim Start von Hand unter „Use workflow from“ den Tag wählen."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test ./...

      - name: Build binaries and the extension package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: make checksums VERSION="$VERSION"

      - name: List artifacts
        run: ls -l dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/malwatch-linux-amd64
            dist/malwatch-linux-arm64
            dist/malwatch.pkg
            dist/SHA256SUMS
